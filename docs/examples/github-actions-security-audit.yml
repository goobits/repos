# GitHub Actions: Security Audit Workflow
#
# This workflow runs repos audit on every push to main branch
# and fails the build for verified or verification-unknown secrets, or when a
# repository scan is incomplete.
#
# Place this file in: .github/workflows/security-audit.yml

name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

permissions:
  contents: read
  pull-requests: write

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for comprehensive secret scanning
        fetch-depth: 0

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install repos
      run: |
        cargo install --git https://github.com/goobits/repos.git --locked --force
        repos --version

    - name: Run security audit
      run: |
        repos audit --install-tools --verify --json > audit-report.json
      continue-on-error: false
      # Nonzero for verified/unknown findings or incomplete scans.

    - name: Upload audit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-audit-report
        path: audit-report.json

    - name: Comment on PR (if audit fails)
      if: failure() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit-report.json', 'utf8'));

          const body = `## ⚠️ Security Audit Failed

          The audit found an unsafe or incomplete result.

          **Verified secrets:** ${report.truffle.summary.verified_secrets}
          **Verification unknown:** ${report.truffle.summary.unknown_secrets}
          **Types:** ${Object.entries(report.truffle.secrets_by_detector).map(([k,v]) => `${v}x ${k}`).join(', ')}

          Review the full artifact, restore any failed scan, and rotate exposed credentials immediately.`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });
